; Per-directory PHP settings for the /api endpoints (and site-wide
; defaults for this app). Raises upload limits for the admin image pipeline.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 120
max_file_uploads = 20

error_log = "/home/headeduc/logs/php.error.log"
log_errors = On
